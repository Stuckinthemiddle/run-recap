AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Run Recap - Garmin weekly mileage API

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: nodejs18.x
  Api:
    Cors:
      AllowMethods: "'GET,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  RunRecapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: run-recap-api
      CodeUri: lambda/
      Handler: handler.handler
      Environment:
        Variables:
          SECRET_NAME: run-recap/garmin
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:run-recap/garmin-*
      Events:
        RunData:
          Type: Api
          Properties:
            Path: /api/run-data
            Method: get
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: get

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
