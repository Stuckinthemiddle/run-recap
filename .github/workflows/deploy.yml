name: Deploy Run Recap

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  FRONTEND_BUCKET: run-recap-app-517093676649
  CLOUDFRONT_DISTRIBUTION: E3R2NI9TJ92BBG
  API_URL: https://cggk3mq6z9.execute-api.us-east-1.amazonaws.com/Prod

jobs:
  deploy-backend:
    name: Deploy Lambda + API Gateway
    runs-on: ubuntu-latest
    # Only run if lambda/ or template.yaml changed
    if: |
      contains(github.event.commits[0].modified, 'lambda/') ||
      contains(github.event.commits[0].added, 'lambda/') ||
      contains(github.event.commits[0].modified, 'template.yaml')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name run-recap \
            --s3-prefix run-recap \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  deploy-frontend:
    name: Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    # Only run if frontend/ changed
    if: |
      contains(toJson(github.event.commits[0].modified), 'frontend/') ||
      contains(toJson(github.event.commits[0].added), 'frontend/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Long-cache all assets (hashed filenames)
          aws s3 sync frontend/dist s3://${{ env.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          # No-cache index.html so browsers always fetch latest
          aws s3 cp frontend/dist/index.html s3://${{ env.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*"
